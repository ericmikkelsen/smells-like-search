name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build flyhash wasm
        run: |
          mkdir -p dist/assembly
          npx -y -p assemblyscript asc assembly/flyhash.ts -O3 --runtime stub -o dist/assembly/flyhash.wasm

      - name: Copy static POC assets
        run: |
          cp index.html dist/index.html
          cp FlyRAGSearchEngine.js dist/FlyRAGSearchEngine.js
          cp rag.worker.js dist/rag.worker.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
