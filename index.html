<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlyRAGSearchEngine POC</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
      textarea, input { width: 100%; box-sizing: border-box; margin: 8px 0 16px; }
      textarea { min-height: 160px; }
      form { border: 1px solid #ddd; padding: 12px; margin-bottom: 16px; }
      button { padding: 8px 16px; }
      #status { white-space: pre-wrap; border: 1px solid #ccc; padding: 12px; min-height: 40px; margin-bottom: 16px; }
      #chatList { list-style: none; padding: 0; margin: 0; border: 1px solid #ccc; min-height: 160px; }
      #chatList li { border-top: 1px solid #eee; padding: 10px 12px; white-space: pre-wrap; }
      #chatList li:first-child { border-top: 0; }
      .role { font-weight: 600; display: block; margin-bottom: 4px; }
      .debug { margin-top: 12px; padding: 10px; border: 1px dashed #bbb; background: #fafafa; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>FlyRAGSearchEngine POC</h1>

    <form id="ingestForm">
      <label for="sourceFile">Upload text file</label>
      <input id="sourceFile" type="file" accept=".txt,.md,.text,text/plain" />

      <label for="sourceText">Or paste source text</label>
      <textarea id="sourceText" placeholder="Paste source text to index for retrieval..."></textarea>

      <button id="ingestBtn" type="submit">Submit Text</button>
    </form>

    <form id="chatForm">
      <label for="chatInput">Message</label>
      <textarea id="chatInput" placeholder="Ask a question about the uploaded/indexed text"></textarea>
      <button id="chatBtn" type="submit">Send Message</button>
    </form>

    <p>Model load progress: <strong id="progress">0%</strong></p>
    <div id="status"></div>

    <ul id="chatList" aria-live="polite"></ul>

    <script type="module">
      import FlyRAGSearchEngine from './FlyRAGSearchEngine.js';

      const progressEl = document.getElementById('progress');
      const statusEl = document.getElementById('status');
      const chatListEl = document.getElementById('chatList');

      const ingestForm = document.getElementById('ingestForm');
      const sourceFileEl = document.getElementById('sourceFile');
      const sourceTextEl = document.getElementById('sourceText');
      const ingestBtn = document.getElementById('ingestBtn');

      const chatForm = document.getElementById('chatForm');
      const chatInputEl = document.getElementById('chatInput');
      const chatBtn = document.getElementById('chatBtn');

      let hasLoadedDocuments = false;
      ingestBtn.disabled = true;
      chatBtn.disabled = true;

      function appendChat(role, text = '') {
        const item = document.createElement('li');
        const roleEl = document.createElement('span');
        const textEl = document.createElement('span');

        roleEl.className = 'role';
        roleEl.textContent = role;
        textEl.textContent = text;

        item.append(roleEl, textEl);
        chatListEl.appendChild(item);
        item.scrollIntoView({ behavior: 'smooth', block: 'end' });

        return textEl;
      }

      function formatScore(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return 'n/a';
        return value.toFixed(3);
      }

      function compactText(text, limit = 260) {
        const raw = String(text ?? '').replace(/\s+/g, ' ').trim();
        if (raw.length <= limit) return raw;
        return `${raw.slice(0, limit)}…`;
      }

      function buildDebugSummary(result) {
        if (!result) return '';
        const lines = [];
        const debug = result.debug ?? {};
        const contexts = Array.isArray(result.contexts) ? result.contexts : [];
        const attempts = Array.isArray(debug.attempts) ? debug.attempts : [];

        lines.push('Retrieval debug');
        lines.push(`stopReason: ${debug.stopReason ?? 'n/a'}`);
        lines.push(`qualityPass: ${String(Boolean(debug.passedQualityGate))}`);
        if (debug.finalScores) {
          lines.push(
            `finalScores: grounded=${formatScore(debug.finalScores.groundedness)} relevance=${formatScore(debug.finalScores.relevance)} contradiction=${formatScore(debug.finalScores.contradiction)} uncertaintyHandled=${String(Boolean(debug.finalScores.uncertaintyHandled))}`,
          );
        }
        if (attempts.length) {
          lines.push('');
          lines.push('Attempts');
          for (const attempt of attempts) {
            const scores = attempt.quality?.scores ?? {};
            lines.push(
              `#${attempt.attempt}: topK=${attempt.topK} coarse=${attempt.coarseLimit} ids=[${(attempt.contextIds ?? []).join(', ')}] new=${attempt.newlyAddedContextCount} pass=${String(Boolean(attempt.quality?.pass))} grounded=${formatScore(scores.groundedness)} relevance=${formatScore(scores.relevance)} contradiction=${formatScore(scores.contradiction)}`,
            );
          }
        }
        if (contexts.length) {
          lines.push('');
          lines.push('Returned contexts');
          contexts.forEach((ctx, idx) => {
            lines.push(
              `Context ${idx + 1} (id=${ctx.id ?? 'n/a'}) fly=${formatScore(ctx.flyScore)} dense=${formatScore(ctx.denseScore)}: ${compactText(ctx.text)}`,
            );
          });
        }

        return lines.join('\n');
      }

      let receivedStatus = false;
      const engine = new FlyRAGSearchEngine({
        quiet: false,
        onProgress: ({ percent }) => {
          progressEl.textContent = `${Math.max(0, Math.min(100, Math.round(percent)))}%`;
        },
        onStatus: ({ text }) => {
          receivedStatus = true;
          statusEl.textContent = text;
        },
      });

      try {
        if (!receivedStatus) statusEl.textContent = 'Initializing models…';
        await engine.initialize();
        statusEl.textContent = 'Engine initialized. Upload or paste text, then submit.';
        ingestBtn.disabled = false;
        chatBtn.disabled = true;
      } catch (error) {
        statusEl.textContent = `Initialization error: ${error instanceof Error ? error.message : String(error)}`;
        ingestBtn.disabled = true;
        chatBtn.disabled = true;
      }

      ingestForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        ingestBtn.disabled = true;

        try {
          const file = sourceFileEl.files?.[0] ?? null;
          const fileText = file ? (await file.text()).trim() : '';
          const manualText = sourceTextEl.value.trim();
          const combinedText = [manualText, fileText].filter(Boolean).join('\n\n');
          const sourceCount = Number(Boolean(manualText)) + Number(Boolean(fileText));

          if (!combinedText) {
            throw new Error('Provide text by file upload or pasted text before submitting.');
          }

          const chunkCount = await engine.loadDocuments(combinedText);
          hasLoadedDocuments = true;
          statusEl.textContent = `Loaded ${chunkCount} chunks from ${sourceCount} source${sourceCount === 1 ? '' : 's'}. You can now send chat messages.`;
          sourceTextEl.value = '';
          sourceFileEl.value = '';
          chatBtn.disabled = false;
        } catch (error) {
          statusEl.textContent = `Load error: ${error instanceof Error ? error.message : String(error)}`;
          if (!hasLoadedDocuments) chatBtn.disabled = true;
        } finally {
          ingestBtn.disabled = false;
        }
      });

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const question = chatInputEl.value.trim();
        if (!question) return;

        appendChat('User', question);
        chatInputEl.value = '';

        if (!hasLoadedDocuments) {
          appendChat('Assistant', 'Please submit source text first.');
          return;
        }

        chatBtn.disabled = true;
        const answerEl = appendChat('Assistant', '');

        try {
          const result = await engine.ask(question, {
            topK: 4,
            onToken(token) {
              answerEl.textContent += token;
            },
          });

          if (!result.answer) {
            answerEl.textContent = '(No answer generated.)';
          }
          const debugSummary = buildDebugSummary(result);
          if (debugSummary) {
            const debugEl = document.createElement('pre');
            debugEl.className = 'debug';
            debugEl.textContent = debugSummary;
            answerEl.parentElement.appendChild(debugEl);
          }
        } catch (error) {
          answerEl.textContent = `Error: ${error instanceof Error ? error.message : String(error)}`;
        } finally {
          chatBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
